[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valeri"
version = "0.1.0"
description = "Modulares Werkzeug für Wirtschaftlichkeitsberechnungen nach DIN EN 17463 (VALERI) und VDI 2067"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
report = ["openpyxl>=3.1"]

[project.scripts]
valeri = "valeri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valeri = ["daten/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
