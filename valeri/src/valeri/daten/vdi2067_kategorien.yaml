# Produktkategorien mit technischen Nutzungsdauern und betriebsgebundenen
# Aufwandskennwerten in Anlehnung an VDI 2067 Blatt 1 (Anhang).
#
# ACHTUNG – Startdatensatz, kein Normauszug:
#   Die Zahlenwerte sind branchenübliche Richtwerte und ersetzen NICHT den
#   Blick in die aktuelle Ausgabe der VDI 2067 Blatt 1. Die Norm ist
#   urheberrechtlich geschützt; die dort tabellierten Werte sind hier bewusst
#   nicht vollständig abgebildet. Jede Kategorie trägt daher `geprueft: false`,
#   bis sie projekt- bzw. büroseitig gegen die Norm verifiziert wurde.
#   Ungeprüfte Kategorien erzeugen im Berechnungsprotokoll einen Hinweis.
#
# Bedeutung der Felder:
#   nutzungsdauer_a        technische Nutzungsdauer -> Ersatzinvestition/Restwert
#   instandsetzung_anteil  Instandsetzungsaufwand je Jahr, Anteil der Investition
#   wartung_anteil         Wartung/Inspektion je Jahr, Anteil der Investition
#   bedienaufwand_h_a      Bedienaufwand in Stunden je Jahr
#   afa_schluessel         Vorgabe-Verknüpfung in afa_bmf.yaml (steuerliche ND)

